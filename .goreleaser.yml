version: 2
before:
  hooks:
    - go mod tidy -v
builds:
  # Dashboard builds
  - id: dashboard_linux_arm64
    env:
      - CGO_ENABLED=1
      - CC=aarch64-linux-gnu-gcc
    ldflags:
      - -s -w
      - -X github.com/naiba/nezha/service/singleton.Version={{.Version}}
      - -extldflags "-static -fpic"
    flags:
      - -trimpath
    goos:
      - linux
    goarch:
      - arm64
    main: ./cmd/dashboard
    binary: dashboard-{{ .Os }}-{{ .Arch }}
  - id: dashboard_linux_amd64
    env:
      - CGO_ENABLED=1
      - CC=x86_64-linux-gnu-gcc
    ldflags:
      - -s -w
      - -X github.com/naiba/nezha/service/singleton.Version={{.Version}}
      - -extldflags "-static -fpic"
    flags:
      - -trimpath
    goos:
      - linux
    goarch:
      - amd64
    main: ./cmd/dashboard
    binary: dashboard-{{ .Os }}-{{ .Arch }}
  - id: dashboard_linux_s390x
    env:
      - CGO_ENABLED=1
      - CC=s390x-linux-gnu-gcc
    ldflags:
      - -s -w
      - -X github.com/naiba/nezha/service/singleton.Version={{.Version}}
      - -extldflags "-static -fpic"
    flags:
      - -trimpath
    goos:
      - linux
    goarch:
      - s390x
    main: ./cmd/dashboard
    binary: dashboard-{{ .Os }}-{{ .Arch }}
  - id: dashboard_windows_amd64
    env:
      - CGO_ENABLED=1
      - CC=x86_64-w64-mingw32-gcc
    ldflags:
      - -s -w
      - -X github.com/naiba/nezha/service/singleton.Version={{.Version}}
      - -extldflags "-static -fpic"
    flags:
      - -trimpath
    goos:
      - windows
    goarch:
      - amd64
    main: ./cmd/dashboard
    binary: dashboard-{{ .Os }}-{{ .Arch }}
  # Agent builds
  - id: agent_universal
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.arch={{.Arch}}
    goos:
      - linux
      - windows
      - freebsd
      - darwin
    goarch:
      - arm
      - arm64
      - 386
      - amd64
      - mips
      - mipsle
      - s390x
      - riscv64
    gomips:
      - softfloat
    ignore:
      - goos: windows
        goarch: arm
    main: ./cmd/agent
    binary: nezha-agent
snapshot:
  version_template: "{{ .Tag }}-next"
